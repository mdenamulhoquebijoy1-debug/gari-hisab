name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter create --platforms=android --project-name car_hisab .

      - name: Update compileSdk
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
          else
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' android/app/build.gradle
          fi

      - name: Add permissions
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=/tmp/upload-keystore.jks
          EOF

      - name: Configure signing in build.gradle
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            # For Kotlin DSL - simplified signing config
            sed -i '/android {/a \    signingConfigs {\n        create("release") {\n            storeFile = file("/tmp/upload-keystore.jks")\n            storePassword = "${{ secrets.KEYSTORE_PASSWORD }}"\n            keyAlias = "${{ secrets.KEY_ALIAS }}"\n            keyPassword = "${{ secrets.KEY_PASSWORD }}"\n        }\n    }' android/app/build.gradle.kts
            sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/' android/app/build.gradle.kts || true
          else
            # For Groovy
            sed -i '/android {/a \    signingConfigs {\n        release {\n            storeFile file("/tmp/upload-keystore.jks")\n            storePassword "${{ secrets.KEYSTORE_PASSWORD }}"\n            keyAlias "${{ secrets.KEY_ALIAS }}"\n            keyPassword "${{ secrets.KEY_PASSWORD }}"\n        }\n    }' android/app/build.gradle
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' android/app/build.gradle || true
          fi

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Get version
        id: version
        run: echo "VERSION=$(jq -r .version version.json)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: গাড়ির হিসাব v${{ steps.version.outputs.VERSION }}
          body: নতুন আপডেট - লোকেশন, ড্রাইভার হিসাব সহ সব ফিচার
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
